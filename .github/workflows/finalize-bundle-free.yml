name: Finalize bundle-free source tree

on:
  push:
    branches:
      - refactor/ui-system-3

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-free-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove transitional artifacts
        run: |
          rm -rf src/recovered
          rm -f scripts/extract-webpack-sources.mjs
          rm -f scripts/dewebpack-worker-source.mjs
          rm -f bundle.worker.js
          rm -f chs.js
          rm -f core.js
          rm -f css2.css
          rm -f .github/workflows/finalize-bundle-free.yml
      - name: Commit final bundle-free tree
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tree already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[bundle-free-finalize] remove legacy bundles and recovery tooling"
          git push
