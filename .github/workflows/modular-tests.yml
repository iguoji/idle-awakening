name: 模块化测试

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装测试依赖
        run: npm install
      - name: 运行模块测试
        run: npm test
      - name: 审计 Babel helper
        run: npm run audit:bundle
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 运行 Browser E2E
        run: npm run test:e2e
