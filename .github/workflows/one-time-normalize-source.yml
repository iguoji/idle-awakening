name: One-time source normalization

on:
  push:
    branches:
      - refactor/ui-system-3

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[source-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize recovered modules
        run: node scripts/normalize-dewebpack-imports.mjs
      - name: Commit normalization
        run: |
          if [ -z "$(git status --porcelain -- src/game)" ]; then
            echo "No source normalization changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game
          git commit -m "[source-normalized] normalize recovered module imports"
          git push
