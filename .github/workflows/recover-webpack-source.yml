name: Recover and dewebpack runtime source

on:
  push:
    branches:
      - refactor/ui-system-3

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[source-recovery]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover webpack modules
        run: node scripts/extract-webpack-sources.mjs --main bundle.js --worker bundle.worker.js --out src/recovered

      - name: Convert worker/framework modules to native ESM
        run: node scripts/dewebpack-worker-source.mjs src/recovered src/game

      - name: Commit recovered source
        run: |
          if [ -z "$(git status --porcelain -- src/recovered src/game)" ]; then
            echo "No recovered source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recovered src/game
          git commit -m "[source-recovery] recover and dewebpack runtime source"
          git push
